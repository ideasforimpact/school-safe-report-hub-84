
# A string used to distinguish different Supabase projects on the same host. Defaults to the
# working directory name when running `supabase init`.
project_id = "ybvxkiubnnixntghojyy"

[api]
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://localhost"

# Email testing server. Emails sent with the local dev setup are not actually sent - rather, they
# are monitored, and you can view the emails that would have been sent from the web interface.
[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://localhost:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[auth.sms]
enable_signup = true
enable_confirmations = false

[auth.external.github]
enabled = false
client_id = ""
secret = ""

[auth.external.google]
enabled = false
client_id = ""
secret = ""
# Overrides the default auth redirectUrl.
redirect_uri = ""
# Overrides the default auth provider URL. Used to support self-hosted gitlab, single-tenant Azure,
# or any other third-party OIDC providers.
url = ""

[analytics]
enabled = false
port = 54327
vector_port = 54328
backend = "postgres"

# Configure one of either "postgres", "clickhouse" or "bigquery" as the analytics backend.
# Postgres: Use supabase/postgres container for analytics.
# Clickhouse: Use supabase/clickhouse container for analytics.
# BigQuery: Use Bigquery for analytics. This is only available on the Supabase platform.
#
# [analytics.postgres]
# Postgres config only needed if analytics.backend = "postgres"
# postgres_db = "postgres"
# postgres_user = "postgres"
# postgres_host = "localhost"
# postgres_password = "postgres"
# postgres_port = 54322
#
# [analytics.clickhouse]
# Clickhouse config only needed if analytics.backend = "clickhouse"
# clickhouse_user = "default"
# clickhouse_password = ""
# clickhouse_host = "localhost"
# clickhouse_port = 8123
# clickhouse_database = "default"
# clickhouse_node_name = "default"

[functions.employee-management]
# Set verify_jwt to false if you need to allow unauthenticated public access.
verify_jwt = true
